[build]
  command = "python3 scripts/construir.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"

# Forzar HTTPS y dominio principal
[[redirects]]
  from = "http://vivirenpaz.tv/*"
  to = "https://vivirenpaz.tv/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/noticias/ultimas.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
